en:
  site_settings:
    discourse_tag_requests_enabled: "Let users who can't create tags request new tags when creating a topic. Requests are reviewed by staff in the review queue."
    tag_requests_allowed_groups: "Groups that can request new tags when creating a topic. Members who can also create tags ({{setting:create_tag_allowed_groups}}) create them directly instead. Requesting also requires {{setting:tag_topic_allowed_groups}}."
    max_tag_requests_per_topic: "Maximum number of new tags a user can request for one topic. Requested tags also count toward {{setting:max_tags_per_topic}}."
    tag_requests_visible_to_groups: "Groups that can see pending tag requests on topics and filter by them. Staff and the topic's author can always see requests on that topic."
  discourse_tag_requests:
    reviewables:
      actions:
        approve_tag_request:
          title: "Approve"
          description: "Create the tag and add it to the requesting topics."
          complete: "Tag created and added to the requesting topics."
        approve_and_edit_tag_request:
          title: "Approve and edit"
          description: "Create the tag, add it to the requesting topics, then open its settings."
          complete: "Tag created and added to the requesting topics."
        use_existing_tag:
          title: "Use existing tag…"
          description: "Add an existing tag to the requesting topics instead."
          complete: "Existing tag added to the requesting topics."
        add_as_synonym:
          title: "Add as synonym…"
          description: "Make the requested name a synonym of an existing tag and add that tag to the requesting topics."
          complete: "Synonym added and tag added to the requesting topics."
        reject:
          title: "Reject"
        reject_tag_request:
          title: "Reject"
          description: "Reject this request. The name can be requested again."
          complete: "Tag request rejected."
        reject_tag_request_permanently:
          title: "Reject permanently"
          description: "Reject this request and block the name from being requested again."
          complete: "Tag request rejected permanently."
      resolution_failed: "This tag request could not be resolved. It may have already been handled."
      tag_not_found: "The selected tag no longer exists."
    filter:
      description:
        pending_tag: "Show topics with a specific pending tag request"
        pending_tag_any: "Show topics with any of the specified pending tag requests (comma-separated)"
        pending_tag_all: "Show topics with all of the specified pending tag requests (plus-separated)"
        exclude_pending_tag: "Exclude topics with a specific pending tag request"
